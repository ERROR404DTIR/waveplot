<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
<title id="title">Waveplot — Audio waveform studio</title><desc id="desc">A glowing waveform visualization on a dark technical canvas.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10243a"/><stop offset="1" stop-color="#090f1c"/></linearGradient><linearGradient id="wave"><stop stop-color="#54e0c0"/><stop offset=".55" stop-color="#8fa8ff"/><stop offset="1" stop-color="#54e0c0"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1200" height="320" rx="24" fill="url(#bg)"/><g stroke="#243951" opacity=".55"><path d="M0 80H1200M0 160H1200M0 240H1200"/><path d="M100 0V320M200 0V320M300 0V320M400 0V320M500 0V320M600 0V320M700 0V320M800 0V320M900 0V320M1000 0V320M1100 0V320"/></g>
<path d="M55 160 C75 160 78 95 98 95S120 225 140 225 165 65 185 65 210 250 230 250 255 110 275 110 300 190 320 190 345 45 365 45 390 275 410 275 435 125 455 125 480 200 500 200 525 75 545 75 570 245 590 245 615 105 635 105 660 185 680 185 705 55 725 55 750 260 770 260 795 115 815 115 840 210 860 210 885 80 905 80 930 235 950 235 975 100 995 100 1020 185 1040 185 1065 65 1085 65 1110 225 1130 225 1150 160 1170 160" fill="none" stroke="url(#wave)" stroke-width="5" stroke-linecap="round" filter="url(#glow)" stroke-dasharray="1900" stroke-dashoffset="1900"><animate attributeName="stroke-dashoffset" values="1900;0;0" keyTimes="0;.7;1" dur="5s" repeatCount="indefinite"/></path>
